# Generation composition for the H1 study: one unattended agent turn with a
# persistent bash tool and a string-replace editor, writing into an isolated
# workspace. Derived from the harness's own examples/jsonrpc-agent/minimal
# composition; the only substitution is the LLM adapter, which is ours because
# the shipped DeepSeek adapter cannot speak to Bedrock mantle (it requires an
# SSE [DONE] sentinel mantle never sends). See adapters/bedrock-mantle.mjs.
#
# Complete unattended minimal-agent composition for the Python SDK. The model
# sees one deployment-selected system prompt and only the owner-scoped
# persistent Bash and string-replace editor tools. Runtime-context injection and
# context compaction are absent.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

# Loaded from OUR repo against the stock runtime, by a specifier relative to
# THIS file. It must be a literal string: the loader resolves `name` before
# `!!js` tags are evaluated, so an expression here arrives as an object and the
# plugin tree fails at boot — which presents as the runtime dying silently and
# the SDK waiting forever, not as a config error.
- id: llm-bedrock-mantle
  name: './adapters/bedrock-mantle.mjs'
  config:
    apiKeyEnv: BEDROCK_MANTLE_API_KEY
    baseURL: !!js process.env.BEDROCK_MANTLE_BASE_URL ?? 'https://bedrock-mantle.us-east-1.api.aws/v1'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pty
  name: '@deepseek-ai/dsh-terminal'

- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  config:
    timeoutMs: 300000

# The editor uses the bare local filesystem; persistent Bash still consumes the
# shared danger-full-access sandbox policy above.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: persistent-bash
  name: '@deepseek-ai/dsh-tool-bash-persistent'
  config:
    timeoutMs: 300000
    description: |-
      Run commands in a bash shell
      * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
      * You don't have access to the internet via this tool.
      * You do have access to a mirror of common linux and python packages via apt and pip.
      * State is persistent across command calls and discussions with the user.
      * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
      * Please avoid commands that may produce a very large amount of output.
      * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# Ours, loaded by a path relative to this file, exactly like the adapter above.
# A plain object registered with ctx.tools.register — no @deepseek-ai dependency;
# see tools/check-sections.mjs for why that matters.
- id: check-sections
  name: './tools/check-sections.mjs'

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none
