# Plan-to-Tutor authorization model — RBAC, declarative.
#
# Casbin answers: "does this user's role have THIS action on THIS kind of object?"
# Scope ("does this user actually own THIS specific workspace / packet / lesson?")
# lives in Python (``app.shared.authz.check_scope``) — that lookup is async and
# data-driven, so it does not belong in a Casbin matcher.
#
# A request resolves as:
#   1. Casbin evaluates ``m`` below → declarative allow / deny.
#   2. If allowed, the helper runs ``check_scope`` against the live DB.
#   Both must pass.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && (r.act == p.act || p.act == "*")
