---
# greencloud (91.109.118.72), staging: a second lpcg instance on the same box
# as production (host_vars/greencloud.yml). Every name below differs from
# production's, so the two never share a unit, directory, port, database,
# vhost, certificate or backup.
#
# Staging deploys main. Secrets, and the staging frontend origins in
# cors_allowed_origins, are in greencloud-staging.vault.yml (gitignored),
# which the play loads for this host.

app_user: www-data
app_root: /opt/lpcg-staging
manage_app_user: false
manage_default_site: false

deploy_env: staging
repo_branch: main
api_service: ptt-api-staging
nginx_site: plan-to-tutor-staging
retired_units: [] # production's retired Celery units are not staging's to stop

backend_port: 8011

server_name: lpcg-staging-api.tosinamuda.com
api_public_port: 443
enable_tls: true
certbot_email: tosinamuda@gmail.com

db_name: lpcg_staging
db_user: lpcg_staging

db_backup_unit: ptt-db-backup-staging
db_backup_schedule: "*-*-* 02:45:00" # after production's 02:30 dump
